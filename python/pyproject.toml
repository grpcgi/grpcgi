[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grpcgi"
version = "0.1.0"
description = "gRPC-to-ASGI bridge server"
requires-python = ">=3.11"
dependencies = [
    # Keep these floors aligned with the checked-in stubs. They are generated
    # with grpcio-tools 1.73.1 / protobuf 6.31.0 and enforce those floors at
    # import time.
    "grpcio>=1.73.1",
    "protobuf>=6.31.0",
]

[project.optional-dependencies]
dev = [
    # Reproducible generated descriptors and runtime-version guards.
    "grpcio-tools==1.73.1",
    "grpcio-testing>=1.60.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["grpcgi*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
